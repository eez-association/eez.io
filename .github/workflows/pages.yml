name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Site path: /<repo>/ on owner.github.io; "" for an <owner>.github.io repo or when the
      # repo variable CUSTOM_DOMAIN is set (e.g. after pointing eez.io at Pages).
      - name: Build _site
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ] || [ "$REPO" = "$OWNER.github.io" ]; then BASE=""; else BASE="/$REPO"; fi
          if [ -n "$CUSTOM_DOMAIN" ]; then SITE_URL="https://$CUSTOM_DOMAIN"; else SITE_URL="https://$OWNER.github.io$BASE"; fi
          BASE="$BASE" SITE_URL="$SITE_URL" python3 tools/pages.py
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > _site/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
